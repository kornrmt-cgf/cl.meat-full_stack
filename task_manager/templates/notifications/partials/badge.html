{% if unread_count > 0 %}
<span id="notification-badge"
      class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white text-xs
             rounded-full flex items-center justify-center font-bold animate-pulse">
    {% if unread_count > 99 %}99+{% else %}{{ unread_count }}{% endif %}
</span>
{% else %}
<span id="notification-badge"></span>
{% endif %}
